<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sala Híbrida PPGPsi</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
}

.container {
    display: flex;
    justify-content: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 700px;
    padding: 25px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    animation: fadeIn 0.4s ease;
}

h1 {
    font-size: 1.2em;
    opacity: 0.8;
}

h2 {
    margin-top: 5px;
}

.step-list {
    margin-top: 15px;
    line-height: 1.6em;
}

.step-list li {
    margin-bottom: 10px;
}

.highlight {
    background: rgba(0,198,255,0.15);
    padding: 5px 8px;
    border-radius: 8px;
}

.alert {
    background: rgba(255, 80, 80, 0.2);
    padding: 10px;
    border-radius: 10px;
    margin-top: 10px;
}

button {
    padding: 10px 15px;
    border-radius: 10px;
    border: none;
    margin-top: 15px;
    cursor: pointer;
    font-weight: bold;
}

.next { background: #00c6ff; }
.prev { background: #444; color: white; }

.details {
    margin-top: 15px;
    display: none;
    font-size: 0.9em;
    opacity: 0.9;
    border-left: 3px solid #00c6ff;
    padding-left: 10px;
}

.progress {
    height: 5px;
    background: #00c6ff;
    transition: 0.3s;
}

@keyframes fadeIn {
    from {opacity:0; transform: translateY(20px);}
    to {opacity:1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="progress" id="progress"></div>

<div class="container">
<div class="card">

<h1>Sala Híbrida PPGPsi</h1>
<h2 id="title"></h2>

<ul class="step-list" id="content"></ul>

<div class="alert" id="alert"></div>

<button onclick="toggleDetails()">🔍 Ver detalhes</button>
<div class="details" id="details"></div>

<br>

<button class="prev" onclick="prevStep()">⬅ Voltar</button>
<button class="next" onclick="nextStep()">Próximo ➡</button>

</div>
</div>

<script>

let step = 0;

const steps = [

{
title: "💻 Preparação Inicial e Hardware",
content: [
"Ligue o computador com suas credenciais institucionais.",
"Verifique se a TV está ligada na entrada HDMI correta.",
"Pressione <span class='highlight'>Windows + P → Estender</span>.",
"Confirme conexão do cabo USB-C da Cougar Cyclops.",
"Remova a tampa de privacidade da câmera."
],
alert: "",
details: "Essa etapa garante que o ambiente físico e digital esteja corretamente preparado. A extensão de tela é essencial para separar controle (monitor) e apresentação (TV)."
},

{
title: "🎥 Iniciando no Google Meet",
content: [
"Faça login no e-mail institucional (@ufscar.br).",
"Acesse o link do Meet da defesa.",
"Abra Configurações (3 pontos).",
"Selecione <span class='highlight'>COUGAR Cyclops</span> como câmera.",
"Selecione Cyclops como microfone e áudio.",
"Inicie a gravação em Atividades → Gravação."
],
alert: "⚠️ Informe a todos que a sessão será gravada.",
details: "A Cyclops é uma câmera 360°, então a configuração correta garante captação adequada de áudio e imagem para a banca remota."
},

{
title: "📊 Apresentação (Aluno)",
content: [
"Arraste o PowerPoint/PDF para a TV.",
"No Meet clique em Apresentar agora.",
"Escolha 'Uma janela' ou 'Uma tela'.",
"Verifique se o slide está visível para todos.",
"Permaneça próximo da câmera."
],
alert: "",
details: "A separação de telas evita confusão e permite controle total da apresentação sem interferir na visualização da banca."
},

{
title: "📋 ProPGWeb (Fluxo Oficial)",
content: [
"Acesse propgweb.ufscar.br.",
"Vá em Defesa → Manutenção de Bancas.",
"Confira dados dos membros.",
"Clique em <span class='highlight'>Liberar Avaliação</span>."
],
alert: "⚠️ Se houver erro nos dados, o parecer não será enviado corretamente.",
details: "A liberação envia automaticamente os links de avaliação para os membros da banca."
},

{
title: "⚖️ Dinâmica da Defesa",
content: [
"Inicie a defesa com gravação ativa.",
"Durante a deliberação, peça saída do aluno.",
"Interrompa a gravação.",
"A banca envia parecer por e-mail.",
"Oriente acompanha status no sistema."
],
alert: "🚫 A deliberação NÃO deve ser gravada.",
details: "Esse é o momento mais crítico do fluxo. O sigilo é obrigatório e institucional."
},

{
title: "✅ Finalização",
content: [
"Confirme envio de todos os pareceres.",
"Finalize no ProPGWeb.",
"Desligue computador e TV.",
"Recoloque tampa da câmera."
],
alert: "",
details: "Essa etapa garante o encerramento formal e preservação dos equipamentos."
}

];

function render() {
    document.getElementById("title").innerText = steps[step].title;

    let list = document.getElementById("content");
    list.innerHTML = "";

    steps[step].content.forEach(item => {
        let li = document.createElement("li");
        li.innerHTML = "✔ " + item;
        list.appendChild(li);
    });

    document.getElementById("alert").innerHTML = steps[step].alert;
    document.getElementById("details").innerText = steps[step].details;
    document.getElementById("details").style.display = "none";

    document.getElementById("progress").style.width =
        ((step+1)/steps.length*100) + "%";
}

function nextStep(){
    if(step < steps.length-1){
        step++;
        render();
    }
}

function prevStep(){
    if(step > 0){
        step--;
        render();
    }
}

function toggleDetails(){
    let d = document.getElementById("details");
    d.style.display = d.style.display === "block" ? "none" : "block";
}

render();

</script>

</body>
</html>
