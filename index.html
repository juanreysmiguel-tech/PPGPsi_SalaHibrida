<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala Híbrida PPGPsi - Profª Drª Ana Lucia Rossito Aiello</title>

<!-- Fontes do Google para tipografia moderna -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<style>
    /* ================= RESET E VARIÁVEIS ================= */
    :root {
        --primary-color: #00e5ff;
        --primary-hover: #00b4cc;
        --bg-glass: rgba(20, 30, 40, 0.65);
        --border-glass: rgba(255, 255, 255, 0.15);
        --text-main: #ffffff;
        --text-muted: #b0c4de;
        --danger: #ff4d4d;
        --success: #00cc66;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ================= BACKGROUND FULLSCREEN ================= */
    body {
        font-family: 'Inter', sans-serif;
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        
        /* Imagem de Fundo Solicitada */
        background: url('https://i.ibb.co/j9pWwQCp/image.png') no-repeat center center fixed;
        background-size: cover;
    }

    /* Overlay escuro para garantir leitura perfeita sobre a imagem */
    .overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, rgba(10, 15, 25, 0.85) 0%, rgba(20, 40, 55, 0.75) 100%);
        backdrop-filter: blur(5px);
        z-index: 0;
    }

    /* ================= LAYOUT PRINCIPAL (GLASS CARD) ================= */
    .app-container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 900px;
        margin: 20px;
        background: var(--bg-glass);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-glass);
        border-radius: 24px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 600px;
    }

    /* ================= HEADER E PROGRESSO ================= */
    .progress-container {
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        width: 100%;
    }
    
    .progress-bar {
        height: 100%;
        width: 0%;
        background: var(--primary-color);
        box-shadow: 0 0 10px var(--primary-color);
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .header {
        padding: 25px 40px;
        border-bottom: 1px solid var(--border-glass);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header-titles h2 {
        font-family: 'Poppins', sans-serif;
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .header-titles span {
        font-size: 0.85rem;
        color: var(--primary-color);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
    }

    .step-counter {
        background: rgba(255, 255, 255, 0.1);
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 0.9rem;
    }

    /* ================= CONTEÚDO DINÂMICO ================= */
    .content-area {
        padding: 40px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .content-area.fade-out {
        opacity: 0;
        transform: translateY(10px);
    }

    .section-badge {
        display: inline-block;
        background: rgba(255, 255, 255, 0.1);
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 15px;
        color: var(--text-muted);
    }

    .step-title {
        font-family: 'Poppins', sans-serif;
        font-size: 2.2rem;
        line-height: 1.2;
        margin-bottom: 20px;
        color: #fff;
    }

    .alert-box {
        display: none;
        background: rgba(255, 77, 77, 0.15);
        border-left: 4px solid var(--danger);
        padding: 12px 20px;
        border-radius: 0 8px 8px 0;
        margin-bottom: 25px;
        color: #ffcccc;
        font-weight: 500;
        align-items: center;
        gap: 10px;
    }

    .alert-box.active { display: flex; }

    .step-details {
        font-size: 1.1rem;
        line-height: 1.7;
        color: var(--text-muted);
    }

    .step-details ul {
        list-style: none;
        margin-top: 15px;
    }

    .step-details li {
        margin-bottom: 12px;
        position: relative;
        padding-left: 28px;
    }

    .step-details li::before {
        content: '👉';
        position: absolute;
        left: 0;
        top: 2px;
        font-size: 1.1rem;
    }

    .step-details .highlight { color: #fff; font-weight: 600; }
    .step-details .success-icon { color: var(--success); }
    .step-details .error-icon { color: var(--danger); }

    /* ================= TELA DE BOAS-VINDAS / BIOGRAFIA ================= */
    .welcome-layout {
        display: flex;
        align-items: center;
        gap: 40px;
    }

    .welcome-photo {
        width: 250px;
        height: 250px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid var(--border-glass);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .welcome-text h1 {
        font-family: 'Poppins', sans-serif;
        font-size: 2.5rem;
        margin-bottom: 10px;
        background: linear-gradient(to right, #ffffff, var(--primary-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .welcome-text h3 {
        color: var(--primary-color);
        font-weight: 400;
        margin-bottom: 20px;
        font-size: 1.2rem;
    }

    .welcome-text p {
        color: var(--text-muted);
        line-height: 1.6;
        font-size: 1.05rem;
        margin-bottom: 15px;
        text-align: justify;
    }

    /* ================= FOOTER / CONTROLES ================= */
    .footer {
        padding: 25px 40px;
        background: rgba(0, 0, 0, 0.2);
        border-top: 1px solid var(--border-glass);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    /* Custom Checkbox */
    .check-container {
        display: flex;
        align-items: center;
        cursor: pointer;
        font-size: 1rem;
        user-select: none;
        color: #fff;
        transition: 0.3s;
    }

    .check-container:hover { color: var(--primary-color); }
    
    .check-container input {
        position: absolute;
        opacity: 0;
        cursor: pointer;
        height: 0;
        width: 0;
    }

    .checkmark {
        height: 24px;
        width: 24px;
        background-color: rgba(255,255,255,0.1);
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 6px;
        margin-right: 15px;
        position: relative;
        transition: 0.3s;
    }

    .check-container input:checked ~ .checkmark {
        background-color: var(--primary-color);
        border-color: var(--primary-color);
    }

    .checkmark:after {
        content: "";
        position: absolute;
        display: none;
        left: 7px;
        top: 3px;
        width: 5px;
        height: 10px;
        border: solid #000;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }

    .check-container input:checked ~ .checkmark:after { display: block; }

    /* Botões */
    .nav-buttons {
        display: flex;
        gap: 15px;
    }

    button {
        padding: 14px 28px;
        border: none;
        border-radius: 12px;
        font-family: 'Poppins', sans-serif;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .btn-prev {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid var(--border-glass);
    }

    .btn-prev:hover { background: rgba(255, 255, 255, 0.2); }

    .btn-next {
        background: var(--primary-color);
        color: #000;
        box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
    }

    .btn-next:hover:not(:disabled) {
        background: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 229, 255, 0.5);
    }

    .btn-next:disabled {
        background: #555;
        color: #888;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
    }

    /* Responsividade */
    @media (max-width: 768px) {
        .welcome-layout {
            flex-direction: column;
            text-align: center;
        }
        .welcome-text p { text-align: center; }
        .footer {
            flex-direction: column;
            gap: 20px;
            align-items: stretch;
        }
        .nav-buttons { justify-content: space-between; }
        .header { padding: 20px; }
        .content-area { padding: 20px; }
        .step-title { font-size: 1.8rem; }
    }
</style>
</head>
<body>

<div class="overlay"></div>

<div class="app-container">
    <!-- Barra de Progresso Superior -->
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Header (Visível após a introdução) -->
    <div class="header" id="appHeader" style="display: none;">
        <div class="header-titles">
            <span>Guia Oficial</span>
            <h2>Sala PPGPsi</h2>
        </div>
        <div class="step-counter" id="stepCounter">1 / 10</div>
    </div>

    <!-- Área de Conteúdo Dinâmico -->
    <div class="content-area" id="contentArea">
        <!-- O conteúdo é injetado via JS aqui -->
    </div>

    <!-- Rodapé de Ações -->
    <div class="footer">
        <div id="checkWrapper">
            <label class="check-container">
                <input type="checkbox" id="doneCheck" onchange="toggleNextButton()">
                <span class="checkmark"></span>
                Confirmo que realizei este passo
            </label>
        </div>
        
        <div class="nav-buttons">
            <button class="btn-prev" id="btnPrev" onclick="prevStep()" style="display: none;">
                ⬅ Anterior
            </button>
            <button class="btn-next" id="btnNext" onclick="nextStep()">
                Iniciar Guia ➡
            </button>
        </div>
    </div>
</div>

<script>
/* 
Estrutura de dados modernizada usando Objetos.
Permite HTML customizado para listas, ícones e destaques.
*/
const stepsData = [
    {
        isWelcome: true,
        title: "Sala Híbrida Profª Drª Ana Lucia Rossito Aiello",
        subtitle: "Departamento de Psicologia (PPGPsi) - UFSCar",
        photo: "https://www.ppgees.ufscar.br/pt-br/assets/imagens/docentes/ana-lucia-rossito-aiello/@@images/b618c58e-04e2-45b7-a2c3-136ee9c1447a.jpeg",
        bio: `
            <p>Este espaço híbrido de defesas foi nomeado em justa homenagem à <b>Profª Drª Ana Lucia Rossito Aiello</b>.</p>
            <p>Docente com trajetória brilhante dedicada ao ensino, pesquisa e extensão, a professora deixou um legado inestimável na formação de profissionais e na construção do conhecimento em Psicologia e Educação Especial.</p>
            <p>Este guia interativo foi criado para garantir que o uso da tecnologia reflita o padrão de excelência sempre defendido por ela.</p>
        `
    },
    {
        section: "Introdução",
        title: "Prepare tudo ANTES da banca",
        alert: "",
        content: `
            <p>A ideia principal é deixar tudo pronto com antecedência. Quando a banca começar de fato, <b>nenhuma</b> configuração deverá ser necessária.</p>
            <ul>
                <li><span class="success-icon">✔</span> Meet já aberto e configurado.</li>
                <li><span class="success-icon">✔</span> Apresentação de slides já compartilhada.</li>
                <li><span class="success-icon">✔</span> Áudio e vídeo perfeitamente testados.</li>
            </ul>
            <p>💡 <i>Isso evita atrasos, constrangimentos e problemas técnicos durante a defesa.</i></p>
        `
    },
    {
        section: "Boas Práticas",
        title: "Evite eco e ruídos no áudio",
        alert: "⚠️ REGRA ESSENCIAL",
        content: `
            <ul>
                <li><span class="error-icon">❌</span> <b>NÃO</b> use o celular ou notebook pessoal com o microfone aberto dentro da sala.</li>
                <li>Se alguém entrar no Meet usando celular (para acompanhar o chat, por exemplo), o microfone e o áudio devem estar <b>mutados/desligados</b>.</li>
                <li>Use <b>apenas</b> o equipamento central (Cougar Cyclops) para captar e reproduzir o som.</li>
            </ul>
            <p>💡 <i>O eco acontece quando dois dispositivos próximos captam e reproduzem o mesmo áudio da reunião.</i></p>
        `
    },
    {
        section: "Preparação",
        title: "Ligando os Equipamentos",
        alert: "",
        content: `
            <p>Vamos iniciar ligando os hardwares básicos da sala:</p>
            <ul>
                <li>Ligue o computador da sala.
                    <br>↳ Usuário: <span class="highlight">Defesa</span>
                    <br>↳ Senha: <span class="highlight">PPGPsiCAPES7</span>
                </li>
                <li>Com o controle remoto, ligue a TV principal.</li>
                <li>Se a imagem do PC não aparecer na TV, pressione <b>Source/Input</b> no controle e escolha a entrada <b>HDMI</b> correspondente.</li>
            </ul>
        `
    },
    {
        section: "Preparação",
        title: "Configurando Múltiplas Telas",
        alert: "",
        content: `
            <p>Para não exibir as abas do seu navegador e anotações para a banca, use o modo Estender.</p>
            <ul>
                <li>No teclado, pressione a tecla <b>Windows + P</b>.</li>
                <li>Clique na opção <span class="highlight">Estender</span>.</li>
            </ul>
            <p>Agora você tem duas áreas independentes:<br>
            Monitor pequeno (onde você controla o Meet) e a TV (onde ficará apenas a apresentação).</p>
        `
    },
    {
        section: "Preparação",
        title: "A Câmera Cougar Cyclops",
        alert: "Não esqueça a tampa!",
        content: `
            <p>A <i>Cougar Cyclops</i> é o coração da sala híbrida: ela é câmera, microfone e caixa de som ao mesmo tempo.</p>
            <ul>
                <li>Conecte o cabo USB-C dela ao computador.</li>
                <li><b>Retire a tampa física</b> da lente no topo do aparelho. Se esquecer, a imagem no Meet ficará toda preta.</li>
                <li>Você pode usar os botões físicos nela para alternar entre "Modo Debate" (foca em quem fala) ou "Modo Panorâmico" (mostra toda a sala).</li>
            </ul>
        `
    },
    {
        section: "Google Meet",
        title: "Acesso e Teste de Hardware",
        alert: "⚠️ FAÇA ANTES DE INICIAR A REUNIÃO",
        content: `
            <p>Entre no Meet com seu e-mail institucional (@ufscar.br) para ter acesso à gravação.</p>
            <ul>
                <li>Na tela de espera do Meet, clique nos <b>3 pontinhos (⋮) > Configurações</b>.</li>
                <li>Em <b>Vídeo</b>: Selecione <i>COUGAR Cyclops</i> e confirme se a imagem aparece.</li>
                <li>Em <b>Áudio</b>: Selecione <i>COUGAR Cyclops</i> tanto para o Microfone quanto para o Alto-falante. Fale alto e veja se a barrinha se move.</li>
                <li>Tudo certo? Clique em <span class="highlight">Participar agora</span>.</li>
            </ul>
        `
    },
    {
        section: "Apresentação",
        title: "Compartilhando Slides",
        alert: "",
        content: `
            <p>Como a tela está estendida, siga o passo a passo para exibir corretamente:</p>
            <ul>
                <li>Abra sua apresentação (PowerPoint/PDF).</li>
                <li>Arraste a janela do programa para a tela da TV.</li>
                <li>No Meet, clique em <b>Apresentar agora > Uma janela</b> e selecione os slides.</li>
                <li>Pergunte à banca remota: <i>"Vocês estão vendo os slides e me ouvindo bem?"</i></li>
            </ul>
        `
    },
    {
        section: "ProPGWeb",
        title: "Conferência do Sistema",
        alert: "⚠️ ETAPA CRÍTICA",
        content: `
            <p>Acesse <span class="highlight">propgweb.ufscar.br</span>, vá em <b>Defesa > Manutenção de Bancas</b>.</p>
            <ul>
                <li>Verifique os nomes e, <b>principalmente</b>, os e-mails dos membros da banca.</li>
                <li>Se algum e-mail estiver errado, corrija <b>antes</b> de iniciar a defesa. Se não corrigir, o avaliador não receberá o link para dar o parecer.</li>
            </ul>
            <p>Deixe a tela logada e pronta para o momento final.</p>
        `
    },
    {
        section: "A Defesa",
        title: "Regras de Gravação e Sigilo",
        alert: "",
        content: `
            <p>A banca chegou no horário? A apresentação vai começar:</p>
            <ul>
                <li>Clique em <b>Atividades > Gravação > Iniciar</b> no Meet.</li>
                <li>Após a apresentação e arguição, ocorre a deliberação. Neste momento, o aluno deve sair da sala física.</li>
                <li><span class="error-icon">🚫</span> <b>PARE A GRAVAÇÃO</b> durante a deliberação (este momento é de sigilo da banca).</li>
            </ul>
        `
    },
    {
        section: "Finalização",
        title: "Pareceres e Encerramento",
        alert: "",
        content: `
            <p>Para concluir os trabalhos com sucesso:</p>
            <ul>
                <li>Libere a avaliação no ProPGWeb. A banca receberá por e-mail.</li>
                <li>Acompanhe no sistema até que todos apareçam como <b>Concluído</b>.</li>
                <li>Após o encerramento oficial, desligue o PC, a TV e coloque novamente a tampa de proteção na câmera Cyclops.</li>
            </ul>
            <p>✨ <i>Parabéns por conduzir a banca com excelência!</i></p>
        `
    }
];

let currentStep = 0;
const totalDataSteps = stepsData.length;

// Elementos do DOM
const contentArea = document.getElementById('contentArea');
const appHeader = document.getElementById('appHeader');
const progressBar = document.getElementById('progressBar');
const stepCounter = document.getElementById('stepCounter');
const btnNext = document.getElementById('btnNext');
const btnPrev = document.getElementById('btnPrev');
const doneCheck = document.getElementById('doneCheck');
const checkWrapper = document.getElementById('checkWrapper');

function renderStep() {
    // Efeito de transição
    contentArea.classList.add('fade-out');
    
    setTimeout(() => {
        const step = stepsData[currentStep];

        if (step.isWelcome) {
            // Renderiza layout da Biografia
            appHeader.style.display = 'none';
            checkWrapper.style.display = 'none';
            btnPrev.style.display = 'none';
            
            btnNext.innerHTML = 'Iniciar Guia ➡';
            btnNext.disabled = false;
            progressBar.style.width = '0%';

            contentArea.innerHTML = `
                <div class="welcome-layout">
                    <img src="${step.photo}" alt="Profª Drª Ana Lucia" class="welcome-photo">
                    <div class="welcome-text">
                        <h1>${step.title}</h1>
                        <h3>${step.subtitle}</h3>
                        ${step.bio}
                    </div>
                </div>
            `;
        } else {
            // Renderiza layout de Passo a Passo
            appHeader.style.display = 'flex';
            checkWrapper.style.display = 'block';
            btnPrev.style.display = 'block';
            
            // Calculo dos passos (ignora a tela inicial de boas vindas para a conta)
            const actualStep = currentStep; 
            const totalSteps = totalDataSteps - 1;
            
            stepCounter.innerText = `${actualStep} / ${totalSteps}`;
            progressBar.style.width = `${(actualStep / totalSteps) * 100}%`;

            // Verifica se tem alerta
            let alertHTML = '';
            if (step.alert) {
                alertHTML = `
                    <div class="alert-box active">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        <span>${step.alert}</span>
                    </div>
                `;
            }

            // Define texto do botão
            if (currentStep === totalDataSteps - 1) {
                btnNext.innerHTML = 'Finalizar ✔️';
            } else {
                btnNext.innerHTML = 'Próximo ➡';
            }

            // Reseta o checkbox
            doneCheck.checked = false;
            btnNext.disabled = true;

            contentArea.innerHTML = `
                <span class="section-badge">${step.section}</span>
                <h2 class="step-title">${step.title}</h2>
                ${alertHTML}
                <div class="step-details">${step.content}</div>
            `;
        }

        contentArea.classList.remove('fade-out');
    }, 300); // Tempo da animação do CSS
}

function nextStep() {
    if (currentStep < totalDataSteps - 1) {
        currentStep++;
        renderStep();
    } else {
        alert("Processo concluído! Você está pronto para a defesa híbrida.");
        currentStep = 0; // Volta ao inicio após finalizar
        renderStep();
    }
}

function prevStep() {
    if (currentStep > 0) {
        currentStep--;
        renderStep();
    }
}

function toggleNextButton() {
    btnNext.disabled = !doneCheck.checked;
}

// Inicializa a aplicação
renderStep();

</script>
</body>
</html>
