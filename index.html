<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sala de Reuniões Híbrida PPGPsi - "Profª Drª Ana Lúcia Rossito Aiello"</title>

<style>

* { box-sizing: border-box; }

    body::before {
    content: "";
    position: fixed;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    width: 300px;
    height: 80vh;

    background: url('https://i.ibb.co/gFR3PfXD/image.png') no-repeat center;
    background-size: contain;

    opacity: 0.12;
    pointer-events: none;
    z-index: 0;

    filter: blur(0.5px);
}
body {
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI";
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    overflow-x:hidden;
}

/* CONTAINER */
.app {
    display:flex;
    flex-direction:column;
    min-height:100vh;
}
    .container {
    position: relative;
    z-index: 1;
}

/* HEADER */
.header {
    padding:20px;
    font-weight:bold;
    opacity:0.8;
}

/* MAIN */
.main {
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* CARD PRINCIPAL */
.container {
    width:100%;
    max-width:750px;
}

/* TÍTULO */
.title {
    font-size:2em;
    font-weight:700;
    margin-bottom:10px;
}

/* SEÇÃO */
.section {
    opacity:0.6;
    margin-bottom:10px;
}

/* CARD DETALHES WOW */
.details-card {
    margin-top:20px;
    padding:25px;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    box-shadow:
        0 10px 40px rgba(0,0,0,0.4),
        inset 0 0 10px rgba(255,255,255,0.05);
    animation:fadeUp 0.5s ease;
    line-height:1.6em;
}

/* ALERTA */
.alert {
    margin-top:15px;
    padding:12px;
    border-radius:12px;
    background:rgba(255,80,80,0.2);
    font-weight:bold;
}

/* CHECK */
.check {
    margin-top:20px;
    font-size:1em;
}

/* NAV */
.nav {
    display:flex;
    justify-content:space-between;
    padding:20px;
}

button {
    padding:14px 20px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
}

.primary {
    background:#00c6ff;
    color:black;
}

.primary:hover {
    transform:scale(1.05);
}

.secondary {
    background:#444;
    color:white;
}

/* PROGRESS */
.progress-bar {
    height:6px;
    background:rgba(255,255,255,0.2);
}

.progress-fill {
    height:100%;
    width:0%;
    background:#00c6ff;
    transition:0.4s;
}

/* ANIMAÇÃO */
@keyframes fadeUp {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<div class="progress-bar">
<div class="progress-fill" id="progress"></div>
</div>

<div class="app">


<div class="header">
Sala Híbrida PPGPsi  
<br>
<small style="opacity:0.6;">
Homenagem à Profª Drª Ana Lucia Rossito Aiello
</small>
</div>


<div class="main">

<div class="container">

<div class="section" id="section"></div>

<div class="title" id="title"></div>

<div class="alert" id="alert"></div>

<div class="details-card" id="details"></div>

<div class="check">
<input type="checkbox" id="done" onchange="enableNext()">
<label>Confirmo que realizei este passo</label>
</div>

</div>

</div>

<div class="nav">
<button class="secondary" onclick="prev()">⬅ Anterior</button>
<div id="counter"></div>
<button class="primary" id="nextBtn" onclick="next()" disabled>Próximo ➡</button>
</div>

</div>

<script>

let i = 0;

const steps = [

/* ================= INTRODUÇÃO ================= */

["Introdução","Como funciona esta sala de defesa híbrida","",
"Esta sala conecta pessoas presenciais e remotas.\n\n✔ O computador transmite a reunião\n✔ A câmera Cougar Cyclops capta imagem e áudio da sala\n✔ A TV mostra a apresentação para quem está presente\n✔ O Google Meet conecta a banca remota\n\n👉 Você seguirá este guia passo a passo\n👉 Avance somente após concluir cada etapa"],

/* ================= BOAS PRÁTICAS ================= */

["Boas Práticas","Evite eco e problemas de áudio","⚠️ MUITO IMPORTANTE",
"1. NÃO use celular ou notebook com microfone aberto\n\n2. Se alguém entrar no Meet pelo celular:\n→ manter microfone DESLIGADO\n\n3. Use apenas a Cyclops como áudio\n\n✔ Isso evita eco (microfonia)\n\n❌ Eco acontece quando mais de um microfone capta o mesmo som"],

["Boas Práticas","Prepare o ambiente da sala","",
"1. Todos devem estar voltados para a câmera\n\n2. Evite conversas paralelas\n\n3. Verifique iluminação da sala\n\n✔ Isso melhora áudio e imagem para a banca"],

/* ================= PREPARAÇÃO ================= */

["Preparação","Ligue o computador da sala","",
"1. Pressione o botão de ligar\n\n2. Aguarde a tela de login\n\n3. Usuário: Defesa\n\n4. Senha: PPGPsiCAPES7\n\n✔ Se entrou → OK\n❌ Se não → verifique digitação"],

["Preparação","Ligue a TV","",
"1. Pegue o controle\n\n2. Pressione o botão de ligar\n\n✔ Tela acesa → OK"],

["Preparação","Selecione o HDMI correto na TV","",
"1. Pressione 'Input' ou 'Source'\n\n2. Escolha a entrada HDMI conectada ao computador\n\n✔ Se aparece o desktop → OK\n❌ Se tela preta → teste outro HDMI"],

["Preparação","Ative o modo Estender (duas telas)","",
"1. Pressione Windows + P\n\n2. Clique em 'Estender'\n\n✔ Agora existem duas telas:\n→ Monitor (controle)\n→ TV (apresentação)\n\n💡 Evita mostrar coisas erradas na TV"],

["Preparação","Conecte a câmera Cougar Cyclops","",
"1. Localize a Cyclops na mesa\n\n2. Conecte o cabo USB-C ao computador\n\n3. Ela é um equipamento 3 em 1:\n→ câmera (imagem)\n→ microfone (áudio)\n→ alto-falante (som)\n\n✔ Nesta etapa não é possível ver a imagem ainda\n\n💡 A verificação será feita no Meet"],

["Preparação","Remova a tampa da câmera","",
"1. Retire a tampa da lente (parte superior)\n\n✔ Importante: sem isso a imagem ficará preta no Meet"],

/* ================= GOOGLE MEET ================= */

["Google Meet","Acesse seu e-mail institucional","",
"1. Abra o navegador (Chrome)\n\n2. Acesse gmail.com\n\n3. Faça login com @ufscar.br\n\n✔ Necessário para gravação"],

["Google Meet","Abra o link da reunião","",
"1. Clique no link do Meet da defesa\n\n✔ A tela da reunião será aberta\n\n💡 Ainda NÃO entre — vamos configurar antes"],

["Google Meet","Abra as configurações","",
"1. Clique nos três pontinhos (⋮)\n\n2. Clique em 'Configurações'\n\n✔ Janela aberta"],

["Google Meet","Configure e verifique a câmera","",
"1. Clique na aba 'Vídeo'\n\n2. Em 'Câmera', selecione:\n→ COUGAR Cyclops\n\n3. Observe a imagem\n\n✔ Se aparece a sala → OK\n❌ Se preta → verifique tampa\n\n💡 Este é o primeiro momento em que você vê a câmera"],

["Google Meet","Configure e teste o áudio","",
"1. Clique na aba 'Áudio'\n\n2. Microfone → COUGAR Cyclops\n\n3. Alto-falante → COUGAR Cyclops\n\n4. Fale algo\n\n✔ Barra de áudio se move → OK\n❌ Se não → verifique o cabo USB-C\n\n💡 Nunca use outro microfone"],

["Google Meet","Ajuste o modo da câmera (Cyclops)","",
"1. Use os botões físicos da câmera\n\n2. Escolha:\n→ Modo debate (foca pessoas)\n→ Modo panorâmico (visão geral)\n\n✔ Ajuste conforme necessidade"],

["Google Meet","Entre na reunião","",
"1. Clique em 'Participar agora'\n\n✔ Você entrou no Meet"],

["Google Meet","Inicie a gravação","⚠️ Obrigatório avisar todos",
"1. Clique em 'Atividades'\n\n2. Clique em 'Gravação'\n\n3. Clique em iniciar\n\n✔ Gravação ativa\n\n💡 Etapa obrigatória"],

/* ================= APRESENTAÇÃO ================= */

["Apresentação","Coloque a apresentação na TV","",
"1. Abra PowerPoint ou PDF\n\n2. Arraste para a TV\n\n✔ TV = público presencial"],

["Apresentação","Compartilhe no Meet","",
"1. Clique em 'Apresentar agora'\n\n2. Escolha 'Uma janela' ou 'Uma tela'\n\n3. Selecione a apresentação\n\n✔ Participantes remotos verão os slides"],

["Apresentação","Confirme se todos estão vendo","",
"1. Pergunte para a banca\n\n✔ Se todos confirmam → OK\n❌ Se não → revise o compartilhamento"],

["Apresentação","Permaneça próximo da câmera","",
"✔ Melhor captação de áudio\n\n💡 A Cyclops capta toda a sala"],

/* ================= PROPGWEB ================= */

["ProPGWeb","Acesse o sistema","",
"1. Abra o navegador\n\n2. Digite: propgweb.ufscar.br\n\n✔ Sistema aberto"],

["ProPGWeb","Acesse a banca","",
"1. Clique em 'Defesa'\n\n2. Clique em 'Manutenção de Bancas'\n\n✔ Lista carregada"],

["ProPGWeb","Confira os dados da banca","⚠️ Etapa crítica",
"1. Verifique nomes\n\n2. Verifique e-mails\n\n✔ Se correto → OK\n❌ Se errado → corrigir antes"],

["ProPGWeb","Clique em Liberar Avaliação","",
"1. Clique no botão 'Liberar Avaliação'\n\n✔ Links enviados automaticamente\n\n💡 Sem isso a banca não consegue avaliar"],

/* ================= DEFESA ================= */

["Defesa","Inicie a defesa","",
"✔ Gravação ativa\n✔ Todos conectados\n✔ Apresentação funcionando"],

["Defesa","Momento de deliberação (sigilo)","",
"1. Peça para o aluno sair\n\n✔ Apenas a banca permanece\n\n💡 Momento sigiloso"],

["Defesa","Interrompa a gravação","🚫 PROIBIDO gravar",
"1. Pare a gravação\n\n✔ Garante sigilo da banca"],

["Defesa","A banca envia os pareceres","",
"1. Cada membro acessa o e-mail\n\n2. Preenche o parecer\n\n✔ Sistema registra automaticamente"],

["Defesa","Acompanhe o envio no sistema","",
"✔ Verifique se todos estão como 'concluído'"],

/* ================= FINALIZAÇÃO ================= */

["Finalização","Confirme que todos os pareceres foram enviados","",
"✔ Todos concluídos"],

["Finalização","Finalize o processo no sistema","",
"✔ Encerramento oficial"],

["Finalização","Desligue os equipamentos","",
"1. Desligue o computador\n\n2. Desligue a TV"],

["Finalização","Recoloque a tampa da câmera","",
"✔ Protege a lente da Cyclops"]

];

function render(){

    let s = steps[i];

    document.getElementById("section").innerText = s[0];
    document.getElementById("title").innerText = s[1];
    document.getElementById("alert").innerText = s[2];

    document.getElementById("details").innerHTML =
        s[3].replace(/\n/g,"<br>");

    document.getElementById("counter").innerText =
        (i+1)+" / "+steps.length;

    document.getElementById("progress").style.width =
        ((i+1)/steps.length*100)+"%";

    document.getElementById("done").checked = false;
    document.getElementById("nextBtn").disabled = true;
}

function next(){
    if(i < steps.length-1){ i++; render(); }
}

function prev(){
    if(i > 0){ i--; render(); }
}

function enableNext(){
    document.getElementById("nextBtn").disabled =
    !document.getElementById("done").checked;
}

render();

</script>

</body>
</html>
