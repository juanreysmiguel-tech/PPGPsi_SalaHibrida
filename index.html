<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guia Sala Híbrida PPGPsi</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
    overflow-x: hidden;
}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    width: 90%;
    max-width: 500px;
    padding: 25px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    animation: fadeIn 0.5s ease;
}

h2 {
    margin-top: 0;
}

button {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    margin: 10px 5px 0 0;
    cursor: pointer;
    background: #00c6ff;
    color: black;
    font-weight: bold;
}

.details {
    margin-top: 10px;
    display: none;
    font-size: 0.9em;
    opacity: 0.9;
}

.progress {
    position: absolute;
    top: 0;
    left: 0;
    height: 5px;
    background: #00c6ff;
    transition: width 0.3s;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="progress" id="progress"></div>

<div class="container">
    <div class="card" id="card">
        <h2 id="title"></h2>
        <p id="content"></p>

        <button onclick="toggleDetails()">Ver detalhes</button>
        <div class="details" id="details"></div>

        <br>
        <button onclick="prevStep()">⬅ Voltar</button>
        <button onclick="nextStep()">Próximo ➡</button>
    </div>
</div>

<script>

let step = 0;

const steps = [
{
title: "💻 Preparação Inicial",
content: "Ligue o computador e configure as telas.",
details: "Usuário: Defesa | Senha: PPGPsiCAPES7\nUse Windows + P → Estender\nVerifique HDMI da TV e conexão USB-C da Cougar."
},
{
title: "🎥 Google Meet",
content: "Entre no Meet e configure áudio e vídeo.",
details: "Selecione COUGAR Cyclops para vídeo e áudio.\nAjuste modos da câmera.\nInicie a gravação."
},
{
title: "📊 Apresentação",
content: "Compartilhe sua apresentação corretamente.",
details: "Arraste o slide para a TV.\nNo Meet → Apresentar agora.\nFique próximo da câmera."
},
{
title: "📋 ProPGWeb",
content: "Libere a avaliação da banca.",
details: "Acesse propgweb.ufscar.br\nVerifique membros.\nClique em Liberar Avaliação."
},
{
title: "⚖️ Defesa",
content: "Conduza a defesa e a deliberação.",
details: "Interrompa gravação no sigilo.\nBanca envia parecer.\nOrientador acompanha."
},
{
title: "✅ Finalização",
content: "Finalize o processo.",
details: "Confirme pareceres.\nDesligue equipamentos.\nFeche a sala."
}
];

function render() {
    document.getElementById("title").innerText = steps[step].title;
    document.getElementById("content").innerText = steps[step].content;
    document.getElementById("details").innerText = steps[step].details;
    document.getElementById("details").style.display = "none";

    document.getElementById("progress").style.width = ((step+1)/steps.length*100)+"%";
}

function nextStep(){
    if(step < steps.length-1){
        step++;
        render();
    }
}

function prevStep(){
    if(step > 0){
        step--;
        render();
    }
}

function toggleDetails(){
    let d = document.getElementById("details");
    d.style.display = d.style.display === "block" ? "none" : "block";
}

render();

</script>

</body>
</html>
