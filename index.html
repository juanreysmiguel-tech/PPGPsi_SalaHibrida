<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sala Híbrida PPGPsi</title>

<style>

body {
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI";
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

.card {
    margin:40px auto;
    width:90%;
    max-width:700px;
    padding:30px;
    border-radius:25px;
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.08);
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
    animation:fade 0.4s ease;
}

.section { opacity:0.7; }
.step { font-size:1.4em; margin:15px 0; }

.alert {
    background:rgba(255,80,80,0.2);
    padding:10px;
    border-radius:10px;
}

.progress-bar {
    height:6px;
    background:rgba(255,255,255,0.2);
    border-radius:10px;
    margin:20px 0;
    overflow:hidden;
}

.progress-fill {
    height:100%;
    width:0%;
    background:#00c6ff;
    transition:0.4s;
}

button {
    padding:12px 18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

.primary { background:#00c6ff; }
.secondary { background:#555; color:white; }

.nav {
    display:flex;
    justify-content:space-between;
    padding:20px;
}

.check { margin-top:15px; }

/* MODAL */
.modal {
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal-content {
    width:90%;
    max-width:600px;
    padding:25px;
    border-radius:20px;
    background:#1c2b36;
    animation:fade 0.3s ease;
}

.close {
    float:right;
    cursor:pointer;
}

@keyframes fade {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<div class="card">

<div class="section" id="section"></div>
<div class="step" id="step"></div>

<div class="alert" id="alert"></div>

<div class="progress-bar">
<div class="progress-fill" id="progress"></div>
</div>

<button onclick="openModal()">🔍 Ver detalhes</button>

<div class="check">
<input type="checkbox" id="done" onchange="enableNext()">
<label>Confirmo que realizei este passo</label>
</div>

</div>

<div class="nav">
<button class="secondary" onclick="prev()">⬅</button>
<div id="counter"></div>
<button class="primary" id="nextBtn" onclick="next()" disabled>➡</button>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">✖</span>
<h3>Detalhes do passo</h3>
<p id="modalText"></p>
</div>
</div>

<script>

let i = 0;

const steps = [

/* ================= PREPARAÇÃO ================= */

["Preparação","Ligue o computador","",
"1. Pressione o botão de ligar do computador\n\n2. Aguarde a tela de login aparecer\n\n3. Digite seu usuário institucional (UFSCar)\n\n4. Digite sua senha do Sagui\n\n✔ Se entrou → OK\n❌ Se não entrou → verifique usuário/senha ou CAPS LOCK"],

["Preparação","Ligue a TV","",
"1. Pegue o controle remoto da TV\n\n2. Pressione o botão de ligar\n\n3. Verifique se a tela acendeu\n\n✔ Se a TV está ligada → OK\n❌ Se não → verifique energia ou controle"],

["Preparação","Coloque a TV na entrada HDMI correta","",
"1. No controle da TV, pressione o botão 'Input' ou 'Source'\n\n2. Selecione a entrada HDMI conectada ao computador\n\n3. Aguarde aparecer a imagem do computador\n\n✔ Se aparece o desktop → OK\n❌ Se tela preta → tente outro HDMI"],

["Preparação","Ative o modo 'Estender tela'","",
"1. No teclado, pressione: Windows + P\n\n2. Vai abrir um menu lateral\n\n3. Clique em 'Estender'\n\n✔ Agora você terá duas telas\n❌ Se não → repita o comando"],

["Preparação","Conecte a câmera Cougar Cyclops","",
"1. Localize o cabo USB-C da Cyclops\n\n2. Conecte diretamente no computador\n\n3. Aguarde alguns segundos\n\n✔ Se conectou → OK\n❌ Se não reconhecer → reconecte"],

["Preparação","Remova a tampa da câmera","",
"1. Vá até o topo da câmera Cyclops\n\n2. Retire a tampa de proteção\n\n✔ Se imagem aparece → OK\n❌ Se tela preta → tampa ainda está fechada"],

/* ================= GOOGLE MEET ================= */

["Google Meet","Acesse seu e-mail institucional","",
"1. Abra o navegador (Chrome)\n\n2. Entre em gmail.com\n\n3. Faça login com @ufscar.br\n\n✔ Se entrou → OK\n❌ Se não → verifique login"],

["Google Meet","Abra o link do Google Meet","",
"1. Localize o link da defesa\n\n2. Clique nele\n\n3. Aguarde carregar a sala\n\n✔ Se apareceu a tela da reunião → OK"],

["Google Meet","Abra as configurações do Meet","",
"1. Na tela do Meet, procure três pontinhos (⋮)\n\n2. Clique neles\n\n3. Clique em 'Configurações'\n\n✔ A janela abriu → OK"],

["Google Meet","Selecione a câmera COUGAR Cyclops","",
"1. Clique na aba 'Vídeo'\n\n2. Em 'Câmera', clique na lista\n\n3. Escolha: COUGAR Cyclops\n\n4. Observe a imagem\n\n✔ Se você aparece → OK\n❌ Se preto → remover tampa"],

["Google Meet","Configure o áudio (microfone e som)","",
"1. Clique na aba 'Áudio'\n\n2. Em Microfone → COUGAR Cyclops\n\n3. Em Alto-falante → COUGAR Cyclops\n\n4. Fale algo para testar\n\n✔ Barra de áudio mexe → OK\n❌ Se não → verifique cabo"],

["Google Meet","Inicie a gravação","⚠️ Avise todos que será gravado",
"1. Clique em 'Atividades'\n\n2. Clique em 'Gravação'\n\n3. Clique em 'Iniciar gravação'\n\n✔ Aparece aviso de gravação\n❌ Se não → verifique permissões"],

/* ================= APRESENTAÇÃO ================= */

["Apresentação","Coloque os slides na TV","",
"1. Abra seu PowerPoint ou PDF\n\n2. Arraste a janela para a TV\n\n✔ Se está na TV → OK"],

["Apresentação","Compartilhe a apresentação no Meet","",
"1. Clique em 'Apresentar agora'\n\n2. Escolha 'Uma janela' ou 'Uma tela'\n\n3. Selecione a apresentação\n\n✔ Se participantes veem → OK"],

["Apresentação","Confirme visualização","",
"1. Pergunte se todos estão vendo\n\n✔ Se sim → OK\n❌ Se não → revise compartilhamento"],

["Apresentação","Fique próximo da câmera","",
"1. Posicione-se perto da Cyclops\n\n✔ Áudio e imagem melhores"],

/* ================= PROPGWEB ================= */

["ProPGWeb","Acesse o sistema","",
"1. Abra o navegador\n\n2. Digite: propgweb.ufscar.br\n\n✔ Se abriu → OK"],

["ProPGWeb","Acesse a banca","",
"1. Vá em Defesa\n\n2. Clique em 'Manutenção de Bancas'\n\n✔ Tela aberta"],

["ProPGWeb","Confira os dados da banca","⚠️ Erros impedem envio",
"1. Verifique nomes\n\n2. Verifique e-mails\n\n✔ Se correto → OK"],

["ProPGWeb","Clique em Liberar Avaliação","",
"1. Clique no botão 'Liberar Avaliação'\n\n✔ Links enviados automaticamente"],

/* ================= DEFESA ================= */

["Defesa","Inicie a defesa","",
"✔ Gravação ativa\n✔ Todos conectados"],

["Defesa","Momento de deliberação","",
"1. Peça para o aluno sair\n\n✔ Ambiente reservado"],

["Defesa","Interrompa a gravação","🚫 Nunca grave a deliberação",
"1. Clique em parar gravação\n\n✔ Gravação pausada"],

["Defesa","Banca envia parecer","",
"1. Cada membro acessa o e-mail\n\n2. Preenche parecer\n\n✔ Status atualizado"],

["Defesa","Acompanhe no sistema","",
"✔ Veja se todos concluíram"],

/* ================= FINALIZAÇÃO ================= */

["Finalização","Confirme envio dos pareceres","",
"✔ Todos enviados"],

["Finalização","Finalize no sistema","",
"✔ Processo encerrado"],

["Finalização","Desligue equipamentos","",
"1. Desligue computador\n\n2. Desligue TV"],

["Finalização","Coloque a tampa da câmera","",
"✔ Proteção da lente"]

];
    
function render(){
    let s = steps[i];

    document.getElementById("section").innerText = s[0];
    document.getElementById("step").innerText = s[1];
    document.getElementById("alert").innerText = s[2];

    document.getElementById("counter").innerText =
        (i+1)+" / "+steps.length;

    document.getElementById("progress").style.width =
        ((i+1)/steps.length*100)+"%";

    document.getElementById("done").checked = false;
    document.getElementById("nextBtn").disabled = true;
}

function next(){ if(i<steps.length-1){ i++; render(); } }
function prev(){ if(i>0){ i--; render(); } }

function enableNext(){
    document.getElementById("nextBtn").disabled =
    !document.getElementById("done").checked;
}

function openModal(){
    document.getElementById("modalText").innerText = steps[i][3];
    document.getElementById("modal").style.display="flex";
}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

render();

</script>

</body>
</html>
