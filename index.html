<style>
    /* ================= RESET E VARIÁVEIS ================= */
    :root {
        --primary-color: #00e5ff;
        --primary-hover: #00b4cc;
        --bg-glass: rgba(20, 30, 40, 0.65);
        --border-glass: rgba(255, 255, 255, 0.15);

    }

        background: linear-gradient(135deg, rgba(10, 15, 25, 0.85) 0%, rgba(20, 40, 55, 0.75) 100%);
        backdrop-filter: blur(5px);
        z-index: 0;
    }

    /* ================= LAYOUT PRINCIPAL (GLASS CARD) ================= */
    .app-container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 900px;
        margin: 20px;
        background: var(--bg-glass);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-glass);
        border-radius: 24px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 600px;
    }

    /* ================= HEADER E PROGRESSO ================= */
    .progress-container { height: 6px; background: rgba(255, 255, 255, 0.1); width: 100%; }
    .progress-bar {
        height: 100%; width: 0%;
        background: var(--primary-color);
        box-shadow: 0 0 10px var(--primary-color);
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .header {
        padding: 25px 40px;
        border-bottom: 1px solid var(--border-glass);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header-titles h2 { font-family: 'Poppins', sans-serif; font-size: 1.2rem; font-weight: 600; }
    .header-titles span { font-size: 0.85rem; color: var(--primary-color); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .step-counter { background: rgba(255, 255, 255, 0.1); padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; }

    /* ================= CONTEÚDO DINÂMICO ================= */
    .content-area {
        padding: 40px; flex: 1; display: flex; flex-direction: column;
        justify-content: center; transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .content-area.fade-out { opacity: 0; transform: translateY(10px); }

    .section-badge {
        display: inline-block; background: rgba(255, 255, 255, 0.1); padding: 6px 14px;
        border-radius: 8px; font-size: 0.85rem; text-transform: uppercase;
        letter-spacing: 1px; margin-bottom: 15px; color: var(--text-muted); width: fit-content;
    }

    .step-title { font-family: 'Poppins', sans-serif; font-size: 2.2rem; line-height: 1.2; margin-bottom: 20px; color: #fff; }

    .alert-box {
        display: none; background: rgba(255, 77, 77, 0.15); border-left: 4px solid var(--danger);
        padding: 12px 20px; border-radius: 0 8px 8px 0; margin-bottom: 25px; color: #ffcccc;
        font-weight: 500; align-items: center; gap: 10px;
    }
    .alert-box.active { display: flex; }

    .step-details { font-size: 1.05rem; line-height: 1.7; color: var(--text-muted); }
    .step-details ul { list-style: none; margin-top: 15px; }
    .step-details li { margin-bottom: 15px; position: relative; padding-left: 28px; }

    .step-details .highlight { color: #fff; font-weight: 600; }
    .step-details .success-icon { color: var(--success); }
    .step-details .error-icon { color: var(--danger); }

    .video-btn {
        display: inline-flex; align-items: center; gap: 10px;
        background: rgba(255, 255, 255, 0.1); border: 1px solid var(--primary-color);
        color: var(--primary-color); padding: 12px 20px; border-radius: 12px;
        text-decoration: none; font-weight: 600; font-size: 1rem; margin-top: 15px;
        transition: all 0.3s ease;
    }
    .video-btn:hover { background: var(--primary-color); color: #000; box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3); }

    /* ================= TELAS ESPECIAIS ================= */
    .welcome-layout { display: flex; align-items: center; gap: 40px; }
    .welcome-photo { width: 250px; height: 250px; border-radius: 50%; object-fit: cover; border: 4px solid var(--border-glass); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .welcome-text h1 { font-family: 'Poppins', sans-serif; font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(to right, #ffffff, var(--primary-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .welcome-text h3 { color: var(--primary-color); font-weight: 400; margin-bottom: 20px; font-size: 1.2rem; }
    .welcome-text p { color: var(--text-muted); line-height: 1.6; font-size: 1.05rem; margin-bottom: 15px; text-align: justify; }

    .profile-selection-container { text-align: center; }
    .profile-selection-container h2 { font-family: 'Poppins', sans-serif; font-size: 2rem; margin-bottom: 30px; }
    .profile-buttons { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    
    .btn-profile {
        flex: 1; min-width: 250px; padding: 40px 20px;
        background: rgba(255, 255, 255, 0.05); border: 2px solid var(--border-glass);
        border-radius: 16px; color: #fff; cursor: pointer; transition: all 0.3s ease;
        display: flex; flex-direction: column; align-items: center; gap: 15px;

    .btn-profile span { font-size: 3rem; }
    .btn-profile strong { font-family: 'Poppins', sans-serif; font-size: 1.3rem; }
    .btn-profile p { font-size: 0.9rem; color: var(--text-muted); margin-top: 10px; }
    .btn-profile:hover { border-color: var(--primary-color); background: rgba(0, 229, 255, 0.1); transform: translateY(-5px); }

    /* ================= FOOTER / CONTROLES ================= */
    .footer { padding: 25px 40px; background: rgba(0, 0, 0, 0.2); border-top: 1px solid var(--border-glass); display: flex; justify-content: space-between; align-items: center; }
    
    .check-container { display: flex; align-items: center; cursor: pointer; font-size: 1rem; user-select: none; color: #fff; transition: 0.3s; }
    .check-container:hover { color: var(--primary-color); }
    .check-container input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
    .checkmark { height: 24px; width: 24px; background-color: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 6px; margin-right: 15px; position: relative; transition: 0.3s; }
    .check-container input:checked ~ .checkmark { background-color: var(--primary-color); border-color: var(--primary-color); }
    .checkmark:after { content: ""; position: absolute; display: none; left: 7px; top: 3px; width: 5px; height: 10px; border: solid #000; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .check-container input:checked ~ .checkmark:after { display: block; }

    .nav-buttons { display: flex; gap: 15px; margin-left: auto; }
    button.action-btn { padding: 14px 28px; border: none; border-radius: 12px; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; }
    .btn-prev { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid var(--border-glass); }
    .btn-prev:hover { background: rgba(255, 255, 255, 0.2); }
    .btn-next { background: var(--primary-color); color: #000; box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3); }
    .btn-next:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 229, 255, 0.5); }
    .btn-next:disabled { background: #555; color: #888; cursor: not-allowed; box-shadow: none; transform: none; }

    @media (max-width: 768px) {
        .welcome-layout { flex-direction: column; text-align: center; }
        .welcome-text p { text-align: center; }
        .footer { flex-direction: column; gap: 20px; align-items: stretch; }
        .nav-buttons { justify-content: space-between; }
        .header { padding: 20px; }
        .content-area { padding: 20px; }
        .step-title { font-size: 1.8rem; }
    }
</style>
</head>

            <p>Com as notas decididas, é hora de oficializar no sistema para que os professores possam assinar.</p>
            <ul>
                <li>Acesse o site <span class="highlight">propgweb.ufscar.br</span>.</li>
                <li>Vá no menu superior em <b>Defesa > Manutenção de Bancas</b> e clique para liberar a avaliação para os membros.</li>
            </ul>
            <p>Em caso de dúvidas sobre onde clicar para fazer essa liberação, assista ao vídeo abaixo:</p>
            <a href="https://youtu.be/dj5GTjKbRc4?t=384" target="_blank" class="video-btn">
                ▶ Assistir Tutorial: Liberação pelo(a) Orientador(a)
            </a>
        `
    },
    {
        section: "6. Burocracia 2",
        title: "Parecer da Banca Examinadora",
        alert: "Acompanhe até o fim",
        content: `
            <p>Após a sua liberação, os membros remotos da banca receberão um e-mail automático do sistema para preencherem seus pareceres e darem a nota formal.</p>

            <a href="https://youtu.be/ylMgcyB-VCk" target="_blank" class="video-btn">
                ▶ Copiar link / Tutorial para Membros da Banca
            </a>

// =======================================================
// LÓGICA DE ESTADO (STATE MACHINE)
// =======================================================

let appState = 'welcome'; // 'welcome', 'profile', 'flow'
let currentFlow = [];
let currentStepIndex = 0;
let userProfile = '';

// Elementos do DOM
const contentArea = document.getElementById('contentArea');
const appHeader = document.getElementById('appHeader');
const appFooter = document.getElementById('appFooter');
const progressBar = document.getElementById('progressBar');
const stepCounter = document.getElementById('stepCounter');
const btnNext = document.getElementById('btnNext');
const btnPrev = document.getElementById('btnPrev');
const doneCheck = document.getElementById('doneCheck');
const checkWrapper = document.getElementById('checkWrapper');
const headerProfileType = document.getElementById('headerProfileType');

function renderApp() {
    contentArea.classList.add('fade-out');
    
    setTimeout(() => {
        if (appState === 'welcome') {
            renderWelcome();
        } else if (appState === 'profile') {
            renderProfileSelection();
        } else if (appState === 'flow') {
            renderFlowStep();
        }
        contentArea.classList.remove('fade-out');
    }, 300);
}

function renderWelcome() {
    appHeader.style.display = 'none';
    checkWrapper.style.display = 'none';
    btnPrev.style.display = 'none';
    appFooter.style.display = 'flex';
    appFooter.style.justifyContent = 'flex-end';
    
    btnNext.innerHTML = 'Iniciar Guia ➡';
    btnNext.disabled = false;
    progressBar.style.width = '0%';

    contentArea.innerHTML = `
        <div class="welcome-layout">
            <img src="${welcomeData.photo}" alt="Profª Drª Ana Lucia" class="welcome-photo">
            <div class="welcome-text">
                <h1>${welcomeData.title}</h1>
                <h3>${welcomeData.subtitle}</h3>
                ${welcomeData.bio}
            </div>
        </div>
    `;
}

function renderProfileSelection() {
    appHeader.style.display = 'none';
    appFooter.style.display = 'flex';
    checkWrapper.style.display = 'none';
    
    btnPrev.style.display = 'flex';
    btnNext.style.display = 'none';
    appFooter.style.justifyContent = 'flex-start'; 
    progressBar.style.width = '10%';

    contentArea.innerHTML = `
        <div class="profile-selection-container">
            <h2>Quem é você nesta banca?</h2>
            <div class="profile-buttons">
                <div class="btn-profile" onclick="selectProfile('advisor')">
                    <span>🎓</span>
                    <strong>Sou Orientador(a)</strong>
                    <p>Presidente da Banca Docente</p>
                </div>
                <div class="btn-profile" onclick="selectProfile('student')">
                    <span>📝</span>
                    <strong>Sou Discente</strong>
                    <p>Aluno(a) apresentando a defesa</p>
                </div>
            </div>
        </div>
    `;
}

function renderFlowStep() {
    appHeader.style.display = 'flex';
    appFooter.style.display = 'flex';
    checkWrapper.style.display = 'block';
    btnPrev.style.display = 'flex';
    btnNext.style.display = 'flex';
    appFooter.style.justifyContent = 'space-between';
    
    const step = currentFlow[currentStepIndex];
    const totalSteps = currentFlow.length;
    
    headerProfileType.innerText = userProfile === 'student' ? 'Guia do(a) Discente' : 'Guia do(a) Orientador(a)';
    stepCounter.innerText = `${currentStepIndex + 1} / ${totalSteps}`;
    
    const progressPercent = ((currentStepIndex + 1) / totalSteps) * 100;
    progressBar.style.width = `${progressPercent}%`;

    let alertHTML = '';
    if (step.alert) {
        alertHTML = `
            <div class="alert-box active">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <span>${step.alert}</span>
            </div>
        `;
    }

    if (currentStepIndex === totalSteps - 1) {
        btnNext.innerHTML = 'Finalizar ✔️';
    } else {
        btnNext.innerHTML = 'Próximo ➡';
    }

    doneCheck.checked = false;
    btnNext.disabled = true;

    contentArea.innerHTML = `
        <span class="section-badge">${step.section}</span>
        <h2 class="step-title">${step.title}</h2>
        ${alertHTML}
        <div class="step-details">${step.content}</div>
    `;
}

// =======================================================
// AÇÕES E CONTROLES
// =======================================================

function selectProfile(type) {
    userProfile = type;
    if (type === 'student') {
        currentFlow = studentSteps;
    } else {
        currentFlow = advisorSteps;
    }
    currentStepIndex = 0;
    appState = 'flow';
    renderApp();
}

function nextAction() {
    if (appState === 'welcome') {
        appState = 'profile';
        renderApp();
    } else if (appState === 'flow') {
        if (currentStepIndex < currentFlow.length - 1) {
            currentStepIndex++;
            renderApp();
        } else {
            alert("Tutorial concluído! Desejamos uma excelente defesa.");
            appState = 'welcome';
            renderApp();
        }
    }
}

function prevAction() {
    if (appState === 'profile') {
        appState = 'welcome';
        renderApp();
    } else if (appState === 'flow') {
        if (currentStepIndex > 0) {
            currentStepIndex--;
            renderApp();
        } else {
            appState = 'profile';
            renderApp();
        }
    }
}

function toggleNextButton() {
    btnNext.disabled = !doneCheck.checked;
}

// Inicializa a aplicação
renderApp();

</script>
</body>
</html>
